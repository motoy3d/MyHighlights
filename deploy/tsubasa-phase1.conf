# フェーズ1・2の検証用 vhost。
# SSMのポートフォワード経由 (http://localhost:8080) で画面を確認するためのもの。
#
# 本番用の deploy/tsubasa.conf との違いは3点:
#   - HTTPSへのリダイレクトをしない
#     (ポートフォワードは平文HTTPなので、リダイレクトすると
#      https://localhost:8080 に飛ばされて繋がらなくなる)
#   - ServerName を絞らない
#     (ブラウザが送るHostは localhost:8080 で、
#      tsubasa.smartj.mobi とは一致しないため)
#   - :443 を定義しない
#     (証明書をまだ配置していないので、SSLEngine on だけ書くと
#      httpd の起動に失敗しうる)
#
# storage のレスポンスヘッダは本番と同じにしてある。
# ここで確認しておけば当夜に持ち越さずに済む。
#
# 切り替え前に tsubasa.conf へ差し替えること。
# 両方を同時に /etc/httpd/conf.d/ に置かないこと（*:80 が二重定義になる）。

<VirtualHost *:80>
    DocumentRoot /var/www/MyHighlights/public

    <Directory /var/www/MyHighlights/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    <Directory /var/www/MyHighlights/public/build/assets>
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Directory>

    # アップロードされたファイルは必ずダウンロードさせる（本番と同一）
    <LocationMatch "^/storage/">
        Header always set Content-Disposition "attachment"
        Header always set X-Content-Type-Options "nosniff"
    </LocationMatch>

    # .env などがWeb公開されないことの二重の保険
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    ErrorLog /var/log/httpd/tsubasa-error.log
    CustomLog /var/log/httpd/tsubasa-access.log combined
</VirtualHost>
