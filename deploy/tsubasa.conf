# Apache vhost。/etc/httpd/conf.d/tsubasa.conf として配置する。
#
# 証明書は certbot の --apache プラグインが
# SSLCertificateFile / SSLCertificateKeyFile を書き込む。

<VirtualHost *:80>
    ServerName tsubasa.smartj.mobi
    DocumentRoot /var/www/MyHighlights/public

    RewriteEngine On
    # ACME(HTTP-01)チャレンジだけはHTTPのまま応答させる。
    # ここを除外しないと証明書の自動更新が失敗しうる。
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]

    <Directory /var/www/MyHighlights/public>
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost *:443>
    ServerName tsubasa.smartj.mobi
    DocumentRoot /var/www/MyHighlights/public

    SSLEngine on
    # SSLCertificateFile / SSLCertificateKeyFile は certbot が追記する

    <Directory /var/www/MyHighlights/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    # ビルド済みアセットは内容ハッシュ付きファイル名なので長期キャッシュしてよい
    <Directory /var/www/MyHighlights/public/build/assets>
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Directory>

    # アップロードされたファイルは必ずダウンロードさせる。
    # HTMLやSVGを添付されると、同一オリジンでスクリプトが実行できてしまうため
    # (投稿の添付は <img> かダウンロードリンクで参照しているので、
    #  Content-Disposition を付けても画面表示には影響しない)
    <LocationMatch "^/storage/">
        Header always set Content-Disposition "attachment"
        Header always set X-Content-Type-Options "nosniff"
    </LocationMatch>

    # .env などがWeb公開されないことの二重の保険
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    ErrorLog /var/log/httpd/tsubasa-error.log
    CustomLog /var/log/httpd/tsubasa-access.log combined
</VirtualHost>
